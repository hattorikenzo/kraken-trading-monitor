name: Kraken scanner budget regression
on:
  workflow_dispatch:
  push:
    paths:
      - app.js
      - index.html
      - r10-strategies.js
      - r10-backtest.js
      - .github/workflows/scanner-budget-regression.yml
permissions:
  contents: read
jobs:
  scanner-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and R10 behavioral invariants
        run: |
          node --check app.js
          node --check r10-strategies.js
          node --check r10-backtest.js
          node <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict'),vm=require('node:vm');
          const src=fs.readFileSync('app.js','utf8'),html=fs.readFileSync('index.html','utf8');
          const elements={},events={};
          const document={getElementById:id=>elements[id]??=( {textContent:'',addEventListener(){},setAttribute(){}} )};
          const window={addEventListener:(name,fn)=>events[name]=fn};
          vm.runInNewContext(src,{document,window,setTimeout(){},setInterval(){}});
          for(const [balance,expected] of [[39,10],[15,10],[10,5],[5,0],[4,0],[7,2]]){
            events['kraken-balance']({detail:{balances:{ZEUR:balance,ZUSD:100}}});
            assert.equal(Number(elements.budgetValue.textContent.split(' ')[0].replace(',','.')),expected);
          }
          events['kraken-balance']({detail:{balances:{ZUSD:100,USDC:100}}});
          assert.equal(elements.budgetValue.textContent,'0,00 EUR');
          assert.equal(window.krakenSelectedOrder,null);
          assert(!/AddOrder\s*\(/.test(src));
          assert(src.includes("quote!=='EUR'"));
          assert(src.includes('scanRotation*48'));
          assert(html.indexOf('src="r10-strategies.js"')>=0);
          assert(html.indexOf('src="r10-strategies.js"')<html.indexOf('src="app.js'));
          const {evaluate}=require('./r10-strategies.js');
          const candles=Array.from({length:30},(_,i)=>({c:100+i/100,h:101+i/100,l:99+i/100,v:100}));
          assert.deepEqual(evaluate([],candles,0.1,200000),[]);
          assert.deepEqual(evaluate(candles,candles,1,200000),[]);
          assert.deepEqual(evaluate(candles,candles,0.1,100),[]);
          const result=evaluate(candles,candles,0.1,200000);
          assert.equal(result.length,4);
          assert(result.every(x=>!x.signal||x.reward/x.risk>=1.25));
          const {simulate}=require('./r10-backtest.js');
          const bars=Array.from({length:40},(_,i)=>({t:i*300,o:100,c:100,h:101,l:99,turnover:200000,minCost:1}));
          const hours=Array.from({length:30},(_,i)=>({t:-108000+i*3600,c:100,h:101,l:99,v:100}));
          const books=simulate(bars,hours,()=>[{strategy:'breakout',signal:true,cost:0.02,risk:0.04,reward:0.06}]);
          assert.equal(Object.keys(books).length,4);
          assert(books.breakout.position);
          assert(books.breakout.cash>=5);
          assert.equal(books.momentum.cash,35);
          assert.equal(books.breakout.position.debit,10);
          console.log('PASS_R10_BACKTEST_ISOLATION');
          console.log('PASS_R10_EUR_BUDGET_RESERVE_NO_ORDER_STRATEGIES');
          NODE
